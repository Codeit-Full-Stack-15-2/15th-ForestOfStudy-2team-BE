      - in: path
        name: habit_id
        required: true
        schema:
          type: integer
        description: 수정할 습관 id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - title
            properties:
              title:
                type: string
                description: 습관 이름
                example: 습관
    responses:
      200:
        description: 습관 수정 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: 습관 id
                          example: 123
                        study_id:
                          type: integer
                          description: 스터디 id
                          example: 456
                        title:
                          type: string
                          description: 습관 이름
                          example: 습관
                    message:
                      type: string
                      example: 습관 수정 성공
      400:
        description: 습관 수정 실패
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  delete:
    summary: 오늘의 습관 삭제
    description: 오늘의 습관을 삭제합니다
    tags:
      - Studies
    parameters:
      - in: path
        name: study_id
        required: true
        schema:
          type: integer
        description: 스터디 id
      - in: path
        name: habit_id
        required: true
        schema:
          type: integer
        description: 삭제할 습관 id
    responses:
      200:
        description: 습관 삭제 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: 습관 id
                          example: 123
                        study_id:
                          type: integer
                          description: 스터디 id
                          example: 456
                        title:
                          type: string
                          description: 습관 이름
                          example: 습관
                    message:
                      type: string
                      example: 습관 삭제 성공
      400:
        description: 습관 삭제 실패
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'