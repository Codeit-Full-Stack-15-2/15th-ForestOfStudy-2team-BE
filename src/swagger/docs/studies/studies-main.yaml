/studies:
  get:
    summary: 스터디 목록 조회
    tags:
      - Studies
    parameters:
      - in: query
        name: orderBy
        schema:
          type: string
          enum: [latest, oldest, highPoints, lowPoints]
        description: 정렬 기준
      - in: query
        name: keyword
        schema:
          type: string
        description: 검색 키워드
      - in: query
        name: pageSize
        schema:
          type: integer
          example: 6
        description: 페이지당 항목 수
      - in: query
        name: page
        schema:
          type: integer
          example: 1
        description: 페이지 번호
    responses:
      200:
        description: 스터디 정보 호출 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        list:
                          type: array
                          items:
                            type: object
                        totalCount:
                          type: integer
                          example: 123
      400:
        description: 스터디 정보 호출 실패
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  post:
    summary: 스터디 만들기
    description: 스터디를 만듭니다.
    tags:
      - Studies
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - nickname
              - title
              - background
              - study_password
            properties:
              nickname:
                type: string
                description: 스터디 닉네임
                example: 연우
              title:
                type: string
                description: 스터디 이름
                example: 개발공장
              description: 
                type: string
                description: 스터디 소개
                example: 소개임
              background:
                type: string
                description: 스터디 배경
                example: "#ffffff/ https://..."
              study_password:
                type: string
                description: 스터디 비밀번호
                example: "123456"
    responses:
      200:
        description: 스터디 생성 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: integer
                      description: 생성된 study id
                      example: 123
                    message:
                      type: string
                      example: 스터디 생성 성공
      400:
        description: 스터디 생성 실패
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/studies/nickname-check:
  get:
    summary: 닉네임 중복 체크
    description: 삭제되지 않은 스터디 전체를 대상으로 닉네임 중복 여부를 확인합니다.
    tags:
      - Studies
    parameters:
      - in: query
        name: nickname
        required: true
        schema:
          type: string
        description: 중복 확인할 닉네임
    responses:
      200:
        description: 닉네임 중복 체크 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        available:
                          type: boolean
                          description: true=사용 가능, false=이미 사용 중
                          example: true
                    message:
                      type: string
                      example: 닉네임 중복 체크 성공
      400:
        description: 닉네임 중복 체크 실패
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/studies/{study_id}:
  get:
    summary: 스터디 개별 조회
    tags:
      - Studies
    parameters:
      - in: path
        name: study_id
        required: true
        schema:
          type: integer
        description: 조회할 스터디 id
    responses:
      200:
        description: 스터디 개별 정보 호출 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: 스터디 id
                          example: 1234
                        nickname:
                          type: string
                          description: 익명 닉네임
                          example: nickname
                        title:
                          type: string
                          description: 스터디 이름
                          example: title
                        description:
                          type: string
                          description: 스터디 설명
                          example: descritpion
                        background:
                          type: string
                          description: 배경화면
                          example: "#ffffff / https://..."
                        point:
                          type: integer
                          description: 획득 포인트
                          example: 150
                        created_at:
                          type: string
                          format: date-time
                          description: 생성 일시
                          example: "2026-09-03T15:34:00Z"
                        emoji:
                          type: array
                          description: 이모지 배열
                          items:
                            type: object
                            properties:
                              emoji:
                                type: string
                                example: "🐣"
                              count:
                                type: integer
                                example: 10
      400:
        description: 스터디 개별 정보 호출 실패
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  patch:
    summary: 스터디 수정
    tags:
      - Studies
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: study_id
        required: true
        schema:
          type: integer
        description: 수정할 스터디 id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - nickname
              - title
              - background
            properties:
              nickname:
                type: string
                description: 스터디 닉네임
                example: 연우
              title:
                type: string
                description: 스터디 이름
                example: 개발공장
              description:
                type: string
                description: 스터디 소개
                example: 소개임
              background:
                type: string
                description: 스터디 배경
                example: "#ffffff/ https://..."
    responses:
      200:
        description: 스터디 수정 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        nickname:
                          type: string
                          example: 연우
                        title:
                          type: string
                          example: 개발공장
                        description:
                          type: string
                          example: 소개임
                        background:
                          type: string
                          example: "#ffffff/ https://..."
                    message:
                      type: string
                      example: 스터디 수정 성공
      401:
        description: 인증 실패 (토큰 없음 또는 유효하지 않음)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      400:
        description: 스터디 수정 실패
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  delete:
    summary: 스터디 삭제
    description: 스터디 소프트 딜리트
    tags:
      - Studies
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: study_id
        required: true
        schema:
          type: integer
        description: 삭제할 스터디 id
    responses:
      200:
        description: 스터디 삭제 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        study_id:
                          type: integer
                          description: 스터디 id
                          example: 456
                        title:
                          type: string
                          description: 스터디 이름
                          example: 개발공장
                    message:
                      type: string
                      example: 스터디 삭제 성공
      401:
        description: 인증 실패 (토큰 없음 또는 유효하지 않음)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      400:
        description: 스터디 삭제 실패
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
